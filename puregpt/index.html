<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#0b0612">
  <title>PureGPT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">✦</span><div><b>PureGPT</b><small>AI Assistant</small></div></div>
    <button id="newChat" class="new-chat">＋ New Chat</button>
  </header>
  <main id="chat">
    <section id="welcome" class="welcome">
      <div class="hero-logo">✦</div>
      <h1>How can I help you?</h1>
      <p>Ask anything and start a conversation with PureGPT.</p>
      <div class="suggestions">
        <button>💡 Explain a difficult topic</button>
        <button>✍️ Help me write something</button>
        <button>💻 Help me with coding</button>
        <button>🧠 Give me creative ideas</button>
      </div>
    </section>
    <section id="messages"></section>
  </main>
  <footer>
    <div class="input-wrap">
      <textarea id="message" rows="1" placeholder="Message PureGPT..."></textarea>
      <button id="send" aria-label="Send">↑</button>
    </div>
    <small>PureGPT can make mistakes. Verify important information.</small>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
